    // 로고는 가운데에 한 번만 짧게: 앱 홈이 준비되면 (최소 0.5초 보여 준 뒤) 바로 걷어내고 홈으로
    (function () {
      var MIN_MS = 500, start = Date.now();
      function hide() {
        var s = document.getElementById('rwnd-splash');
        if (!s) return;
        setTimeout(function () {
          s.classList.add('hide'); setTimeout(function () { s.remove(); }, 200);
        }, Math.max(0, MIN_MS - (Date.now() - start)));
      }
      window.addEventListener('flutter-first-frame', hide);
      setTimeout(hide, 15000); // 혹시 앱이 늦게 떠도 로고가 영원히 덮지 않게
    })();
  </script>
