<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/rwnd-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="RWND - Rock Will Never Die. 국내외 락 아티스트 소식">
  <meta name="theme-color" content="#111113">

  <!--
    Uncomment the tag below to lay the app out underneath the parts of the
    screen that the device obstructs, such as a display cutout, the rounded
    corners of the screen, or a home indicator.

    Without it, the browser keeps the app clear of them, and `SafeArea` and
    `MediaQuery.paddingOf` report no padding. With it, the app covers the whole
    screen, and it is up to the app to keep its own content out of the way,
    which is what `SafeArea` is for.
  -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"> -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RWND">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RWND</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="splash/logo.webp" as="image">
  <style>
    html,body{margin:0;height:100%;background:#111113;}
    html.light,html.light body{background:#F4F3F0;}
    /* Flutter가 뜨기 전에 바로 보이는 로고 (앱 스플래시와 같은 크기·위치) */
    #rwnd-splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:9999;
      background:inherit;transition:opacity .25s ease;}
    #rwnd-splash img{width:clamp(180px,62vw,320px);height:auto;}
    #rwnd-splash.hide{opacity:0;pointer-events:none;}
  </style>
  <script>
    // MY > 다크 모드 설정을 그대로 따라 첫 화면 배경색을 맞춤 (기본은 다크)
    try { if ((localStorage.getItem('flutter.theme_mode') || '').indexOf('light') >= 0) document.documentElement.className = 'light'; } catch (e) {}
  </script>
</head>
<body>
  <div id="rwnd-splash" aria-label="RWND, Rock Will Never Die"><img src="splash/logo.webp" alt="RWND"></div>
  <script>
    // 앱 첫 화면이 그려지면 HTML 로고를 걷어냄 (앱의 스플래시가 같은 자리에 이어서 보임)
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('rwnd-splash');
      if (!s) return; s.classList.add('hide'); setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
